<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Полная статистика матча | Центр тренера</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b1120;
      --panel-bg: #151f32;
      --card-bg: #1e293b;
      --border-color: #2b3952;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 50;
    }

    .nav-links-hub { display: flex; align-items: center; gap: 8px; }
    .nav-btn-link {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .nav-btn-link:hover { background: rgba(255,255,255,0.06); color: var(--text-main); }
    .nav-btn-link.active { background: #0284c7; color: #fff; border-color: var(--accent-blue); }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      gap: 16px;
    }

    .match-header-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .score-badge {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent-blue);
      background: #090e17;
      border: 1px solid var(--border-color);
      padding: 4px 16px;
      border-radius: 8px;
    }

    .section-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .table-wrapper {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
      white-space: nowrap;
    }
    th {
      background: #1e293b;
      padding: 8px 10px;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }
    td {
      padding: 6px 10px;
      border-bottom: 1px solid var(--border-color);
    }
    tr:hover td { background: rgba(56, 189, 248, 0.04); }

    button {
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #334155; }
    button.btn-accent { background: #0284c7; border-color: var(--accent-blue); }
  </style>
</head>
<body>

<header>
  <nav class="nav-links-hub">
    <a href="./index.html" class="nav-btn-link"><i class="ph-bold ph-calendar-check"></i> Центр управления</a>
    <a href="./tablet.html" class="nav-btn-link"><i class="ph-bold ph-hockey-puck"></i> Планшет тренера</a>
    <a href="./stats.html" class="nav-btn-link active"><i class="ph-bold ph-chart-bar"></i> Полная статистика</a>
  </nav>

  <div>
    <button onclick="window.location.href='./index.html'" class="btn-accent">
      <i class="ph-bold ph-arrow-left"></i> Назад в календарь
    </button>
  </div>
</header>

<main class="main-container">
  <div class="match-header-card">
    <div>
      <div style="font-size:12px; color:var(--text-muted);" id="statDateLabel">Дата: —</div>
      <h2 style="font-size:1.3rem; margin-top:4px;" id="statOpponentLabel">Матч: —</h2>
      <div style="font-size:12px; color:var(--accent-green); margin-top:2px;" id="statTypeLabel">Официальный матч</div>
    </div>
    <div class="score-badge" id="statScoreBadge">— : —</div>
  </div>

  <div class="section-card">
    <h3 style="font-size:14px; color:var(--accent-blue); display:flex; align-items:center; gap:6px;">
      <i class="ph-bold ph-shield"></i> Вратари
    </h3>
    <div class="table-wrapper">
      <table id="goaliesTable">
        <thead>
          <tr>
            <th style="width:50px;">№</th>
            <th style="text-align:left;">Вратарь</th>
            <th>Передачи (А)</th>
            <th>Штраф (мин)</th>
          </tr>
        </thead>
        <tbody id="goaliesTableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="section-card">
    <h3 style="font-size:14px; color:var(--accent-amber); display:flex; align-items:center; gap:6px;">
      <i class="ph-bold ph-users-three"></i> Полевые игроки (Защитники и Нападающие)
    </h3>
    <div class="table-wrapper">
      <table id="skatersTable">
        <thead>
          <tr>
            <th style="width:50px;">№</th>
            <th style="text-align:left;">Игрок</th>
            <th>Голы (Ш)</th>
            <th>Передачи (А)</th>
            <th>Очки (О)</th>
            <th>+/-</th>
            <th>Штраф (мин)</th>
          </tr>
        </thead>
        <tbody id="skatersTableBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  localforage.config({ name: 'HockeyCoachHub', storeName: 'coach_hub_calendar' });

  window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    const dateKey = params.get('date');
    if (!dateKey) {
      document.getElementById('statOpponentLabel').textContent = 'Дата матча не выбрана';
      return;
    }

    const hubDays = await localforage.getItem('hockey_hub_days') || {};
    const dayData = hubDays[dateKey] || {};
    const match = dayData.match || {};
    const players = dayData.players || [];

    document.getElementById('statDateLabel').textContent = `Дата: ${dateKey}`;
    document.getElementById('statOpponentLabel').textContent = `Матч: против ${match.opponent || '—'}`;
    document.getElementById('statScoreBadge').textContent = match.score || '— : —';
    document.getElementById('statTypeLabel').textContent = match.type === 'official' ? 'Официальный матч' : (match.type === 'tournament' ? 'Турнир' : 'Товарищеская игра');

    const gBody = document.getElementById('goaliesTableBody');
    const sBody = document.getElementById('skatersTableBody');
    gBody.innerHTML = '';
    sBody.innerHTML = '';

    players.forEach(p => {
      const isGoalie = (p.name && p.name.includes('(Вр)')) || p.isGoalie;
      if (isGoalie) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${p.num || '—'}</b></td>
          <td style="text-align:left;">${p.name}</td>
          <td>${p.a || '0'}</td>
          <td>${p.pim || '0'}</td>
        `;
        gBody.appendChild(tr);
      } else {
        const pts = (parseInt(p.g) || 0) + (parseInt(p.a) || 0);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${p.num || '—'}</b></td>
          <td style="text-align:left;">${p.name}</td>
          <td style="color:var(--accent-green); font-weight:bold;">${p.g || '0'}</td>
          <td>${p.a || '0'}</td>
          <td style="font-weight:bold;">${pts}</td>
          <td style="color:${String(p.plusMinus).startsWith('+') ? 'var(--accent-green)' : (String(p.plusMinus).startsWith('-') ? 'var(--accent-red)' : 'inherit')};">${p.plusMinus || '0'}</td>
          <td>${p.pim || '0'}</td>
        `;
        sBody.appendChild(tr);
      }
    });

    if (gBody.children.length === 0) {
      gBody.innerHTML = '<tr><td colspan="4" style="color:var(--text-muted); padding:10px;">Вратари не указаны</td></tr>';
    }
    if (sBody.children.length === 0) {
      sBody.innerHTML = '<tr><td colspan="7" style="color:var(--text-muted); padding:10px;">Полевые игроки не указаны</td></tr>';
    }
  });
</script>
</body>
</html>
