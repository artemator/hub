<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Полная статистика матча и аналитика | Центр тренера</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b1120;
      --panel-bg: #151f32;
      --card-bg: #1e293b;
      --border-color: #2b3952;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 50;
    }
    .nav-links-hub { display: flex; align-items: center; gap: 8px; }
    .nav-btn-link {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-btn-link:hover { background: rgba(255,255,255,0.06); color: var(--text-main); }
    .nav-btn-link.active { background: #0284c7; color: #fff; border-color: var(--accent-blue); }

    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
      max-width: 1500px;
      width: 100%;
      margin: 0 auto;
      gap: 16px;
    }
    .match-header-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .score-badge {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-blue);
      background: #090e17;
      border: 1px solid var(--border-color);
      padding: 4px 16px;
      border-radius: 8px;
    }
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: #090e17;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 14px;
    }
    select, button {
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:hover { background: #334155; }
    button.active { background: #0284c7; border-color: var(--accent-blue); }
    .section-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .table-wrapper {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-x: auto;
      max-height: 520px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }
    th {
      background: #1e293b;
      padding: 8px 6px;
      color: var(--text-muted);
      font-weight: 700;
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border-color);
    }
    td {
      padding: 6px 6px;
      border-bottom: 1px solid var(--border-color);
    }
    tr:hover td { background: rgba(56, 189, 248, 0.05); }
  </style>
</head>
<body>

<header>
  <nav class="nav-links-hub">
    <a href="./index.html" class="nav-btn-link"><i class="ph-bold ph-calendar-check"></i> Центр управления</a>
    <a href="./tablet.html" class="nav-btn-link"><i class="ph-bold ph-hockey-puck"></i> Планшет тренера</a>
    <a href="./stats.html" class="nav-btn-link active"><i class="ph-bold ph-chart-bar"></i> Полная статистика</a>
  </nav>
  <button onclick="window.location.href='./index.html'" class="btn-accent">
    <i class="ph-bold ph-arrow-left"></i> В календарь
  </button>
</header>

<main class="main-container">
  <div class="match-header-card">
    <div>
      <div style="font-size:12px; color:var(--text-muted);" id="statDateLabel">Дата: —</div>
      <h2 style="font-size:1.3rem; margin-top:4px;" id="statOpponentLabel">Матч: —</h2>
      <div style="font-size:12px; color:var(--accent-green); margin-top:2px;" id="statTypeLabel">Официальный матч</div>
    </div>
    <div class="score-badge" id="statScoreBadge">— : —</div>
  </div>

  <!-- ПАНЕЛЬ РЕЖИМОВ СТАТИСТИКИ И AVG-АНАЛИТИКИ -->
  <div class="filter-bar">
    <span style="font-size:12px; font-weight:700; color:var(--text-muted);">РЕЖИМ ОТОБРАЖЕНИЯ:</span>
    <button id="btnViewSingle" class="active" onclick="switchViewMode('single')">
      <i class="ph-bold ph-calendar"></i> Этот матч (вся таблица МХЛ)
    </button>
    <button id="btnViewAllAvg" onclick="switchViewMode('avg_all')">
      <i class="ph-bold ph-calculator"></i> Средняя (AVG) за все матчи
    </button>
    <div style="display:flex; align-items:center; gap:6px; margin-left:auto;">
      <span style="font-size:11px; color:var(--text-muted);">Соперник:</span>
      <select id="opponentSelect" onchange="switchViewMode('avg_opponent')"></select>
      <button id="btnViewOpponentAvg" onclick="switchViewMode('avg_opponent')">
        <i class="ph-bold ph-crosshair"></i> AVG против соперника
      </button>
    </div>
  </div>

  <div class="section-card">
    <h3 style="font-size:14px; color:var(--accent-blue); display:flex; align-items:center; gap:6px;">
      <i class="ph-bold ph-shield"></i> Вратари
    </h3>
    <div class="table-wrapper">
      <table id="goaliesTable">
        <thead id="goaliesThead"></thead>
        <tbody id="goaliesTbody"></tbody>
      </table>
    </div>
  </div>

  <div class="section-card">
    <h3 style="font-size:14px; color:var(--accent-amber); display:flex; align-items:center; gap:6px;">
      <i class="ph-bold ph-users-three"></i> Полевые игроки (Защитники и Нападающие)
    </h3>
    <div class="table-wrapper">
      <table id="skatersTable">
        <thead id="skatersThead"></thead>
        <tbody id="skatersTbody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
  // Безопасный fallback на случай проблем с сетью или CDN
  (function initStorage() {
    if (typeof window.localforage === 'undefined') {
      window.localforage = {
        config: function() {},
        getItem: async function(key) {
          try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; }
        },
        setItem: async function(key, val) {
          try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
        }
      };
    } else {
      try {
        window.localforage.config({ name: 'HockeyCoachHub', storeName: 'coach_hub_calendar' });
      } catch(e) {}
    }
  })();

  let allDaysData = {};
  let currentDateKey = null;
  let currentOpponent = '';
  let viewMode = 'single';

  // 25 числовых параметров в точном соответствии с официальной шапкой МХЛ
  const SKATER_HEADERS_MHL = [
    "И", "Ш", "А", "О", "+/-", "+", "-", "Штр", "ШР", "ШБ", "ШМ", "ШО", "ШП",
    "РБ", "БВ", "%БВ", "Вбр", "ВВбр", "%Вбр", "ВП/И", "См/И", "СПр", "БлБ", "ОТБ", "ПХТ"
  ];

  window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    currentDateKey = params.get('date');

    try {
      allDaysData = await window.localforage.getItem('hockey_hub_days') || {};
    } catch(e) {
      allDaysData = {};
    }

    populateOpponentSelect();

    if (currentDateKey && allDaysData[currentDateKey]) {
      const match = allDaysData[currentDateKey].match || {};
      currentOpponent = match.opponent || '';
      document.getElementById('statDateLabel').textContent = `Дата: ${currentDateKey}`;
      document.getElementById('statOpponentLabel').textContent = `Матч: против ${currentOpponent || '—'}`;
      document.getElementById('statScoreBadge').textContent = match.score || '— : —';
      document.getElementById('statTypeLabel').textContent = match.type === 'official' ? 'Официальный матч' : (match.type === 'tournament' ? 'Турнир' : 'Товарищеская игра');
      document.getElementById('opponentSelect').value = currentOpponent;
    } else {
      document.getElementById('statOpponentLabel').textContent = 'Общая аналитика команды';
      viewMode = 'avg_all';
      document.getElementById('btnViewSingle').classList.remove('active');
      document.getElementById('btnViewAllAvg').classList.add('active');
    }

    renderAllTables();
  });

  function populateOpponentSelect() {
    const select = document.getElementById('opponentSelect');
    if (!select) return;
    select.innerHTML = '<option value="">-- Выберите соперника --</option>';
    const opponents = new Set();
    Object.values(allDaysData).forEach(day => {
      if (day && day.match && day.match.opponent) opponents.add(day.match.opponent.trim());
    });
    opponents.forEach(opp => {
      const opt = document.createElement('option');
      opt.value = opp;
      opt.textContent = opp;
      select.appendChild(opt);
    });
  }

  function switchViewMode(mode) {
    viewMode = mode;
    document.getElementById('btnViewSingle').classList.toggle('active', mode === 'single');
    document.getElementById('btnViewAllAvg').classList.toggle('active', mode === 'avg_all');
    document.getElementById('btnViewOpponentAvg').classList.toggle('active', mode === 'avg_opponent');
    renderAllTables();
  }

  function renderAllTables() {
    if (viewMode === 'single') {
      renderSingleMatchTables();
    } else if (viewMode === 'avg_all') {
      renderAvgTables(null);
    } else if (viewMode === 'avg_opponent') {
      const opp = document.getElementById('opponentSelect').value;
      if (!opp) {
        alert('Пожалуйста, выберите соперника из выпадающего списка!');
        return;
      }
      renderAvgTables(opp);
    }
  }

  function renderSingleMatchTables() {
    const day = allDaysData[currentDateKey] || {};
    const players = day.players || [];

    const gThead = document.getElementById('goaliesThead');
    const sThead = document.getElementById('skatersThead');
    if (!gThead || !sThead) return;

    gThead.innerHTML = `
      <tr>
        <th style="width:40px;">№</th>
        <th style="text-align:left;">Вратарь</th>
        <th>И</th><th>В</th><th>П</th><th>ИБ</th><th>БВ</th><th>ПШ</th><th>ОБ</th><th>%ОБ</th><th>КН</th><th>А</th><th>И"0"</th><th>Штр</th><th>ВП</th>
      </tr>
    `;

    let sHead = '<tr><th style="width:40px;">№</th><th style="text-align:left;">Игрок</th>';
    SKATER_HEADERS_MHL.forEach(h => sHead += `<th>${h}</th>`);
    sHead += '</tr>';
    sThead.innerHTML = sHead;

    const gBody = document.getElementById('goaliesTbody');
    const sBody = document.getElementById('skatersTbody');
    gBody.innerHTML = '';
    sBody.innerHTML = '';

    players.forEach(p => {
      const isGoalie = (p.name && p.name.includes('(Вр)')) || p.isGoalie;
      if (isGoalie) {
        const raw = p.rawMhl || [];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${p.num || '—'}</b></td>
          <td style="text-align:left;"><b>${p.name || ''}</b></td>
          <td>${raw[0] || '1'}</td><td>${raw[1] || '0'}</td><td>${raw[2] || '0'}</td>
          <td>${raw[3] || '0'}</td><td>${raw[4] || '0'}</td><td>${raw[5] || '0'}</td>
          <td>${raw[6] || '0'}</td><td>${raw[7] || '—'}</td><td>${raw[8] || '—'}</td>
          <td style="color:var(--accent-green); font-weight:bold;">${p.a || '0'}</td>
          <td>${raw[10] || '0'}</td><td>${p.pim || '0'}</td><td>${p.toi || '—'}</td>
        `;
        gBody.appendChild(tr);
      } else {
        const raw = p.rawMhl || [];
        const tr = document.createElement('tr');
        const pts = (parseInt(p.g) || 0) + (parseInt(p.a) || 0);

        // Ищем индекс времени ММ:СС среди токенов
        const timeIdx = raw.findIndex(t => /^\d{1,2}:\d{2}$/.test(t));

        let rowHtml = `
          <td><b>${p.num || '—'}</b></td>
          <td style="text-align:left;"><b>${p.name || ''}</b></td>
          <td>${raw[0] || '1'}</td>
          <td style="color:var(--accent-green); font-weight:bold;">${p.g || '0'}</td>
          <td>${p.a || '0'}</td>
          <td style="font-weight:bold; color:var(--accent-blue);">${pts}</td>
          <td style="font-weight:bold; color:${String(p.plusMinus).startsWith('+') ? 'var(--accent-green)' : (String(p.plusMinus).startsWith('-') ? 'var(--accent-red)' : 'inherit')};">${p.plusMinus || '0'}</td>
          <td>${raw[4] || '0'}</td>
          <td>${raw[5] || '0'}</td>
          <td>${p.pim || '0'}</td>
        `;

        // Отрисовка всех остальных 18 параметров (ШР..ПХТ)
        for (let idx = 8; idx < SKATER_HEADERS_MHL.length; idx++) {
          const colName = SKATER_HEADERS_MHL[idx];
          if (colName === 'ВП/И') {
            rowHtml += `<td><b>${p.toi && p.toi !== '00:00' ? p.toi : (timeIdx > -1 ? raw[timeIdx] : '—')}</b></td>`;
          } else if (colName === 'См/И') {
            const shiftVal = (timeIdx > -1 && raw[timeIdx + 1]) ? raw[timeIdx + 1] : (raw[idx] || '0');
            rowHtml += `<td>${shiftVal}</td>`;
          } else {
            rowHtml += `<td>${raw[idx] || '0'}</td>`;
          }
        }
        tr.innerHTML = rowHtml;
        sBody.appendChild(tr);
      }
    });

    if (gBody.children.length === 0) gBody.innerHTML = '<tr><td colspan="15" style="color:var(--text-muted); padding:10px;">Вратари не указаны</td></tr>';
    if (sBody.children.length === 0) sBody.innerHTML = `<tr><td colspan="${SKATER_HEADERS_MHL.length + 2}" style="color:var(--text-muted); padding:10px;">Полевые игроки не указаны</td></tr>`;
  }

  function renderAvgTables(opponentFilter) {
    const oppLabel = opponentFilter ? `против «${opponentFilter}»` : 'за все матчи';
    document.getElementById('statOpponentLabel').textContent = `Средняя статистика (AVG) ${oppLabel}`;
    document.getElementById('statScoreBadge').textContent = 'AVG';

    const gThead = document.getElementById('goaliesThead');
    const sThead = document.getElementById('skatersThead');
    if (!gThead || !sThead) return;

    gThead.innerHTML = `
      <tr>
        <th style="width:40px;">№</th>
        <th style="text-align:left;">Вратарь</th>
        <th style="color:var(--accent-amber);">Игр сыграно</th>
        <th>AVG Пасы (А)</th>
        <th>AVG Штраф (мин)</th>
      </tr>
    `;

    sThead.innerHTML = `
      <tr>
        <th style="width:40px;">№</th>
        <th style="text-align:left;">Игрок</th>
        <th style="color:var(--accent-amber);">Игр сыграно</th>
        <th>AVG Голы (Ш)</th>
        <th>AVG Пасы (А)</th>
        <th>AVG Очки (О)</th>
        <th>AVG +/-</th>
        <th>AVG Штраф (мин)</th>
        <th>AVG Время на поле (ВП/И)</th>
        <th>AVG Количество смен (См/И)</th>
      </tr>
    `;

    const gStats = {};
    const sStats = {};

    Object.values(allDaysData).forEach(day => {
      if (!day || !day.match) return;
      const match = day.match;
      if (opponentFilter && match.opponent?.trim().toLowerCase() !== opponentFilter.trim().toLowerCase()) {
        return;
      }

      (day.players || []).forEach(p => {
        const isGoalie = (p.name && p.name.includes('(Вр)')) || p.isGoalie;
        const key = `${p.num || ''}_${p.name}`;

        if (isGoalie) {
          if (!gStats[key]) gStats[key] = { num: p.num, name: p.name, games: 0, a: 0, pim: 0 };
          gStats[key].games++;
          gStats[key].a += parseInt(p.a) || 0;
          gStats[key].pim += parseInt(p.pim) || 0;
        } else {
          if (!sStats[key]) sStats[key] = { num: p.num, name: p.name, games: 0, g: 0, a: 0, pts: 0, plusMinus: 0, pim: 0, toiSec: 0, shifts: 0 };
          const g = parseInt(p.g) || 0;
          const a = parseInt(p.a) || 0;
          const raw = p.rawMhl || [];

          // Смены идут сразу после времени ММ:СС
          let shiftsCount = 0;
          const timeIdx = raw.findIndex(t => /^\d{1,2}:\d{2}$/.test(t));
          if (timeIdx > -1 && raw[timeIdx + 1]) {
            shiftsCount = parseInt(raw[timeIdx + 1]) || 0;
          } else {
            shiftsCount = parseInt(raw[20]) || parseInt(raw[21]) || 0;
          }

          let sec = p.toiSeconds || 0;
          if (!sec && p.toi) {
            const parts = String(p.toi).split(':').map(Number);
            sec = (parts[0] || 0) * 60 + (parts[1] || 0);
          }

          sStats[key].games++;
          sStats[key].g += g;
          sStats[key].a += a;
          sStats[key].pts += (g + a);
          sStats[key].plusMinus += parseInt(p.plusMinus) || 0;
          sStats[key].pim += parseInt(p.pim) || 0;
          sStats[key].toiSec += sec;
          sStats[key].shifts += shiftsCount;
        }
      });
    });

    const gBody = document.getElementById('goaliesTbody');
    const sBody = document.getElementById('skatersTbody');
    gBody.innerHTML = '';
    sBody.innerHTML = '';

    Object.values(gStats).forEach(st => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${st.num || '—'}</b></td>
        <td style="text-align:left;"><b>${st.name}</b></td>
        <td style="font-weight:bold; color:var(--accent-amber);">${st.games}</td>
        <td>${(st.a / st.games).toFixed(2)}</td>
        <td>${(st.pim / st.games).toFixed(2)}</td>
      `;
      gBody.appendChild(tr);
    });

    Object.values(sStats).forEach(st => {
      const tr = document.createElement('tr');
      const avgPm = (st.plusMinus / st.games).toFixed(2);
      tr.innerHTML = `
        <td><b>${st.num || '—'}</b></td>
        <td style="text-align:left;"><b>${st.name}</b></td>
        <td style="font-weight:bold; color:var(--accent-amber);">${st.games}</td>
        <td style="color:var(--accent-green); font-weight:bold;">${(st.g / st.games).toFixed(2)}</td>
        <td>${(st.a / st.games).toFixed(2)}</td>
        <td style="color:var(--accent-blue); font-weight:bold;">${(st.pts / st.games).toFixed(2)}</td>
        <td style="font-weight:bold; color:${avgPm > 0 ? 'var(--accent-green)' : (avgPm < 0 ? 'var(--accent-red)' : 'inherit')};">${avgPm > 0 ? '+' + avgPm : avgPm}</td>
        <td>${(st.pim / st.games).toFixed(2)}</td>
        <td style="font-weight:600;">${(() => {
          const avgSec = Math.round((st.toiSec || 0) / st.games);
          const m = Math.floor(avgSec / 60);
          const s = avgSec % 60;
          return `${m}:${s < 10 ? '0' : ''}${s}`;
        })()}</td>
        <td>${((st.shifts || 0) / st.games).toFixed(1)}</td>
      `;
      sBody.appendChild(tr);
    });

    if (gBody.children.length === 0) gBody.innerHTML = '<tr><td colspan="5" style="color:var(--text-muted); padding:10px;">Нет данных по вратарям</td></tr>';
    if (sBody.children.length === 0) sBody.innerHTML = '<tr><td colspan="10" style="color:var(--text-muted); padding:10px;">Нет данных по игрокам</td></tr>';
  }
</script>
</body>
</html>
