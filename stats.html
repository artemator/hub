<script>
  localforage.config({ name: 'HockeyCoachHub', storeName: 'coach_hub_calendar' });

  let allDaysData = {};
  let currentDateKey = null;
  let currentOpponent = '';
  let viewMode = 'single'; // 'single' | 'avg_all' | 'avg_opponent'

  const SKATER_HEADERS_MHL = [
    "№", "Игрок", "И", "Ш", "А", "О", "+/-", "+", "-", "Штр", "ШР", "ШБ", "ШМ", "ШО", "ШП",
    "РБ", "БВ", "%БВ", "Вбр", "ВВбр", "%Вбр", "ВП/И", "См/И", "СПр", "БлБ", "ОТБ", "ПХТ"
  ];

  window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(window.location.search);
    currentDateKey = params.get('date');

    allDaysData = await localforage.getItem('hockey_hub_days') || {};
    populateOpponentSelect();

    if (currentDateKey && allDaysData[currentDateKey]) {
      const match = allDaysData[currentDateKey].match || {};
      currentOpponent = match.opponent || '';
      document.getElementById('statDateLabel').textContent = `Дата: ${currentDateKey}`;
      document.getElementById('statOpponentLabel').textContent = `Матч: против ${currentOpponent || '—'}`;
      document.getElementById('statScoreBadge').textContent = match.score || '— : —';
      document.getElementById('statTypeLabel').textContent = match.type === 'official' ? 'Официальный матч' : (match.type === 'tournament' ? 'Турнир' : 'Товарищеская игра');
      document.getElementById('opponentSelect').value = currentOpponent;
    } else {
      document.getElementById('statOpponentLabel').textContent = 'Общая аналитика команды';
      viewMode = 'avg_all';
    }

    renderAllTables();
  });

  function populateOpponentSelect() {
    const select = document.getElementById('opponentSelect');
    select.innerHTML = '<option value="">-- Выберите соперника --</option>';
    const opponents = new Set();
    Object.values(allDaysData).forEach(day => {
      if (day.match && day.match.opponent) opponents.add(day.match.opponent.trim());
    });
    opponents.forEach(opp => {
      const opt = document.createElement('option');
      opt.value = opp;
      opt.textContent = opp;
      select.appendChild(opt);
    });
  }

  function switchViewMode(mode) {
    viewMode = mode;
    document.getElementById('btnViewSingle').classList.toggle('active', mode === 'single');
    document.getElementById('btnViewAllAvg').classList.toggle('active', mode === 'avg_all');
    document.getElementById('btnViewOpponentAvg').classList.toggle('active', mode === 'avg_opponent');
    renderAllTables();
  }

  function renderAllTables() {
    if (viewMode === 'single') {
      renderSingleMatchTables();
    } else if (viewMode === 'avg_all') {
      renderAvgTables(null);
    } else if (viewMode === 'avg_opponent') {
      const opp = document.getElementById('opponentSelect').value;
      if (!opp) {
        alert('Пожалуйста, выберите соперника из списка!');
        return;
      }
      renderAvgTables(opp);
    }
  }

  function renderSingleMatchTables() {
    const day = allDaysData[currentDateKey] || {};
    const players = day.players || [];

    document.getElementById('goaliesThead').innerHTML = `
      <tr>
        <th style="width:40px;">№</th>
        <th style="text-align:left;">Вратарь</th>
        <th>И</th><th>В</th><th>П</th><th>ИБ</th><th>БВ</th><th>ПШ</th><th>ОБ</th><th>%ОБ</th><th>КН</th><th>А</th><th>И"0"</th><th>Штр</th><th>ВП</th>
      </tr>
    `;

    let sHead = '<tr>';
    SKATER_HEADERS_MHL.forEach(h => sHead += `<th>${h}</th>`);
    sHead += '</tr>';
    document.getElementById('skatersThead').innerHTML = sHead;

    const gBody = document.getElementById('goaliesTbody');
    const sBody = document.getElementById('skatersTbody');
    gBody.innerHTML = '';
    sBody.innerHTML = '';

    players.forEach(p => {
      const isGoalie = (p.name && p.name.includes('(Вр)')) || p.isGoalie;
      if (isGoalie) {
        const raw = p.rawMhl || [];
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>${p.num || '—'}</b></td>
          <td style="text-align:left;"><b>${p.name}</b></td>
          <td>${raw[0] || '1'}</td><td>${raw[1] || '0'}</td><td>${raw[2] || '0'}</td>
          <td>${raw[3] || '0'}</td><td>${raw[4] || '0'}</td><td>${raw[5] || '0'}</td>
          <td>${raw[6] || '0'}</td><td>${raw[7] || '—'}</td><td>${raw[8] || '—'}</td>
          <td style="color:var(--accent-green); font-weight:bold;">${p.a || '0'}</td>
          <td>${raw[10] || '0'}</td><td>${p.pim || '0'}</td><td>${p.toi || '—'}</td>
        `;
        gBody.appendChild(tr);
      } else {
        const raw = p.rawMhl || [];
        const tr = document.createElement('tr');
        const pts = (parseInt(p.g) || 0) + (parseInt(p.a) || 0);

        let rowHtml = `
          <td><b>${p.num || '—'}</b></td>
          <td style="text-align:left;"><b>${p.name}</b></td>
          <td>${raw[0] || '1'}</td>
          <td style="color:var(--accent-green); font-weight:bold;">${p.g || '0'}</td>
          <td>${p.a || '0'}</td>
          <td style="font-weight:bold; color:var(--accent-blue);">${pts}</td>
          <td style="font-weight:bold; color:${String(p.plusMinus).startsWith('+') ? 'var(--accent-green)' : (String(p.plusMinus).startsWith('-') ? 'var(--accent-red)' : 'inherit')};">${p.plusMinus || '0'}</td>
          <td>${raw[4] || '0'}</td><td>${raw[5] || '0'}</td>
          <td>${p.pim || '0'}</td>
        `;
        for (let idx = 7; idx < SKATER_HEADERS_MHL.length; idx++) {
          rowHtml += `<td>${raw[idx] || '0'}</td>`;
        }
        tr.innerHTML = rowHtml;
        sBody.appendChild(tr);
      }
    });

    if (gBody.children.length === 0) gBody.innerHTML = '<tr><td colspan="15" style="color:var(--text-muted); padding:10px;">Вратари не указаны</td></tr>';
    if (sBody.children.length === 0) sBody.innerHTML = `<tr><td colspan="${SKATER_HEADERS_MHL.length}" style="color:var(--text-muted); padding:10px;">Полевые игроки не указаны</td></tr>`;
  }

  function renderAvgTables(opponentFilter) {
    const oppLabel = opponentFilter ? `против «${opponentFilter}»` : 'за все матчи';
    document.getElementById('statOpponentLabel').textContent = `Средняя статистика (AVG) ${oppLabel}`;
    document.getElementById('statScoreBadge').textContent = 'AVG';

    document.getElementById('goaliesThead').innerHTML = `
      <tr>
        <th style="width:40px;">№</th>
        <th style="text-align:left;">Вратарь</th>
        <th style="color:var(--accent-amber);">Игр сыграно</th>
        <th>AVG Пасы (А)</th>
        <th>AVG Штраф (мин)</th>
      </tr>
    `;

    document.getElementById('skatersThead').innerHTML = `
      <tr>
        <th style="width:40px;">№</th>
        <th style="text-align:left;">Игрок</th>
        <th style="color:var(--accent-amber);">Игр сыграно</th>
        <th>AVG Голы (Ш)</th>
        <th>AVG Пасы (А)</th>
        <th>AVG Очки (О)</th>
        <th>AVG +/-</th>
        <th>AVG Штраф (мин)</th>
      </tr>
    `;

    const gStats = {};
    const sStats = {};

    Object.values(allDaysData).forEach(day => {
      const match = day.match;
      if (!match) return;
      if (opponentFilter && match.opponent?.trim().toLowerCase() !== opponentFilter.trim().toLowerCase()) {
        return;
      }

      (day.players || []).forEach(p => {
        const isGoalie = (p.name && p.name.includes('(Вр)')) || p.isGoalie;
        const key = `${p.num || ''}_${p.name}`;

        if (isGoalie) {
          if (!gStats[key]) gStats[key] = { num: p.num, name: p.name, games: 0, a: 0, pim: 0 };
          gStats[key].games++;
          gStats[key].a += parseInt(p.a) || 0;
          gStats[key].pim += parseInt(p.pim) || 0;
        } else {
          if (!sStats[key]) sStats[key] = { num: p.num, name: p.name, games: 0, g: 0, a: 0, pts: 0, plusMinus: 0, pim: 0 };
          const g = parseInt(p.g) || 0;
          const a = parseInt(p.a) || 0;
          sStats[key].games++;
          sStats[key].g += g;
          sStats[key].a += a;
          sStats[key].pts += (g + a);
          sStats[key].plusMinus += parseInt(p.plusMinus) || 0;
          sStats[key].pim += parseInt(p.pim) || 0;
        }
      });
    });

    const gBody = document.getElementById('goaliesTbody');
    const sBody = document.getElementById('skatersTbody');
    gBody.innerHTML = '';
    sBody.innerHTML = '';

    Object.values(gStats).forEach(st => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><b>${st.num || '—'}</b></td>
        <td style="text-align:left;"><b>${st.name}</b></td>
        <td style="font-weight:bold; color:var(--accent-amber);">${st.games}</td>
        <td>${(st.a / st.games).toFixed(2)}</td>
        <td>${(st.pim / st.games).toFixed(2)}</td>
      `;
      gBody.appendChild(tr);
    });

    Object.values(sStats).forEach(st => {
      const tr = document.createElement('tr');
      const avgPm = (st.plusMinus / st.games).toFixed(2);
      tr.innerHTML = `
        <td><b>${st.num || '—'}</b></td>
        <td style="text-align:left;"><b>${st.name}</b></td>
        <td style="font-weight:bold; color:var(--accent-amber);">${st.games}</td>
        <td style="color:var(--accent-green); font-weight:bold;">${(st.g / st.games).toFixed(2)}</td>
        <td>${(st.a / st.games).toFixed(2)}</td>
        <td style="color:var(--accent-blue); font-weight:bold;">${(st.pts / st.games).toFixed(2)}</td>
        <td style="font-weight:bold; color:${avgPm > 0 ? 'var(--accent-green)' : (avgPm < 0 ? 'var(--accent-red)' : 'inherit')};">${avgPm > 0 ? '+' + avgPm : avgPm}</td>
        <td>${(st.pim / st.games).toFixed(2)}</td>
      `;
      sBody.appendChild(tr);
    });

    if (gBody.children.length === 0) gBody.innerHTML = '<tr><td colspan="5" style="color:var(--text-muted); padding:10px;">Нет данных по вратарям</td></tr>';
    if (sBody.children.length === 0) sBody.innerHTML = '<tr><td colspan="8" style="color:var(--text-muted); padding:10px;">Нет данных по игрокам</td></tr>';
  }
</script>
