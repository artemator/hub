<script>
  localforage.config({
    name: 'HockeyCoachHub',
    storeName: 'coach_hub_calendar'
  });

  let currentYear = 2026;
  let currentMonth = 8; // Сентябрь (0-индексированный)
  let activeSelectedDateKey = null;

  let hubDaysData = {};

  const monthNames = [
    "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
    "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
  ];

  window.addEventListener('DOMContentLoaded', async () => {
    try {
      const loaded = await localforage.getItem('hockey_hub_days');
      if (loaded) hubDaysData = loaded;
    } catch (e) {
      console.warn("Ошибка чтения IndexedDB:", e);
    }
    renderCalendar();
  });

  async function saveToStorage() {
    try {
      await localforage.setItem('hockey_hub_days', hubDaysData);
    } catch (e) {
      console.warn("Ошибка сохранения IndexedDB:", e);
    }
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    } else if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }
    renderCalendar();
  }

  function goToToday() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    renderCalendar();
  }

  function renderCalendar() {
    const titleEl = document.getElementById('calendarMonthTitle');
    if (titleEl) {
      titleEl.textContent = `${monthNames[currentMonth]} ${currentYear}`;
    }

    const grid = document.getElementById('calendarDaysGrid');
    if (!grid) return;
    grid.innerHTML = '';

    const firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 0; i < firstDayIndex; i++) {
      const pad = document.createElement('div');
      pad.className = 'day-cell empty-pad';
      grid.appendChild(pad);
    }

    const todayStr = new Date().toISOString().slice(0, 10);

    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dateKey === todayStr) cell.classList.add('is-today');

      const data = hubDaysData[dateKey];
      let badgesHtml = '';
      if (data) {
        if (data.training && data.training.title) {
          badgesHtml += `<div class="event-badge badge-training" title="Тренировка: ${data.training.title}"><i class="ph-bold ph-clipboard"></i> <span>${data.training.title}</span></div>`;
        }
        if (data.match && data.match.opponent) {
          const scoreStr = data.match.score ? ` (${data.match.score})` : '';
          badgesHtml += `<div class="event-badge badge-match" title="Матч: против ${data.match.opponent}"><i class="ph-bold ph-trophy"></i> <span>${data.match.opponent}${scoreStr}</span></div>`;
        }
      }

      cell.innerHTML = `
        <div class="day-number-row">
          <span class="day-num">${d}</span>
        </div>
        <div class="day-badges-col">${badgesHtml}</div>
      `;

      cell.onclick = () => openDayModal(dateKey);
      grid.appendChild(cell);
    }
  }

  function openDayModal(dateKey) {
    activeSelectedDateKey = dateKey;
    const parts = dateKey.split('-');
    document.getElementById('modalDayTitle').textContent = `${parseInt(parts[2])} ${monthNames[parseInt(parts[1]) - 1]} ${parts[0]}`;

    const data = hubDaysData[dateKey] || {};

    document.getElementById('trainTitle').value = data.training?.title || '';
    document.getElementById('trainTime').value = data.training?.time || '';
    document.getElementById('trainDuration').value = data.training?.duration || '';
    document.getElementById('trainGoals').value = data.training?.goals || '';

    const attachedStatus = document.getElementById('attachedDocxStatus');
    if (data.training?.attachedDocxName) {
      attachedStatus.innerHTML = `<span style="color:var(--accent-green);"><i class="ph-bold ph-check"></i> Прикреплен файл: <b>${data.training.attachedDocxName}</b></span>`;
    } else {
      attachedStatus.textContent = 'Конспект не выбран';
    }

    document.getElementById('matchOpponent').value = data.match?.opponent || '';
    document.getElementById('matchScore').value = data.match?.score || '';
    document.getElementById('matchType').value = data.match?.type || 'official';

    renderPlayersTable(data.players || []);
    renderDayHighlights(data.players || []);
    switchDayTab('training');
    document.getElementById('dayHubModal').style.display = 'flex';
  }

  function closeDayModal() {
    document.getElementById('dayHubModal').style.display = 'none';
  }

  function switchDayTab(tab) {
    document.getElementById('tabBtnTraining').classList.toggle('active', tab === 'training');
    document.getElementById('tabBtnMatch').classList.toggle('active', tab === 'match');
    document.getElementById('tabContentTraining').classList.toggle('active', tab === 'training');
    document.getElementById('tabContentMatch').classList.toggle('active', tab === 'match');
  }

  function renderPlayersTable(players) {
    const tbody = document.getElementById('playersTableBody');
    tbody.innerHTML = '';
    if (players.length === 0) {
      addPlayerRow();
      return;
    }
    players.forEach(p => addPlayerRow(p));
  }

  function addPlayerRow(player = { num: '', name: '', g: '0', a: '0', plusMinus: '0', pim: '0', toi: '00:00' }) {
    const tbody = document.getElementById('playersTableBody');
    const tr = document.createElement('tr');
    tr.dataset.toi = player.toi || '00:00';
    tr.dataset.toiSeconds = player.toiSeconds || 0;
    tr.dataset.isGoalie = player.isGoalie ? '1' : '0';
    if (player.rawMhl) {
      tr.dataset.rawMhl = JSON.stringify(player.rawMhl);
    }

    tr.innerHTML = `
      <td><input type="text" class="p-num" value="${player.num || ''}" placeholder="№"></td>
      <td style="text-align:left;"><input type="text" class="p-name" value="${player.name || ''}" placeholder="Фамилия Имя" style="text-align:left;"></td>
      <td><input type="number" class="p-g" value="${player.g || '0'}"></td>
      <td><input type="number" class="p-a" value="${player.a || '0'}"></td>
      <td><input type="text" class="p-pm" value="${player.plusMinus || '0'}"></td>
      <td><input type="number" class="p-pim" value="${player.pim || '0'}"></td>
      <td><button onclick="this.closest('tr').remove()" style="padding:2px 5px; color:#ef4444;"><i class="ph ph-trash"></i></button></td>
    `;
    tbody.appendChild(tr);
  }

  function renderDayHighlights(players) {
    const card = document.getElementById('dayHighlightsCard');
    const list = document.getElementById('dayHighlightsList');
    if (!card || !list) return;

    if (!players || players.length === 0) {
      card.style.display = 'none';
      return;
    }

    const goalies = players.filter(p => (p.name && p.name.includes('(Вр)')) || p.isGoalie);
    const skaters = players.filter(p => !((p.name && p.name.includes('(Вр)')) || p.isGoalie));

    let html = '';

    // 1 вратарь с наибольшим временем на льду
    if (goalies.length > 0) {
      const bestGoalie = [...goalies].sort((a, b) => (b.toiSeconds || 0) - (a.toiSeconds || 0))[0];
      html += `<div>🏒 <b>Основной вратарь:</b> #${bestGoalie.num || '—'} ${bestGoalie.name} (ВП: ${bestGoalie.toi || '—'}, Штр: ${bestGoalie.pim || 0})</div>`;
    }

    // Полевые игроки: набравшие очки, либо топ-5 по времени/очкам
    const scorers = skaters.filter(p => {
      const pts = (parseInt(p.pts) || (parseInt(p.g) || 0) + (parseInt(p.a) || 0));
      return pts > 0;
    });

    let chosenSkaters = [];

    if (scorers.length >= 5) {
      chosenSkaters = scorers.sort((a, b) => {
        const ptsA = (parseInt(a.pts) || (parseInt(a.g) || 0) + (parseInt(a.a) || 0));
        const ptsB = (parseInt(b.pts) || (parseInt(b.g) || 0) + (parseInt(b.a) || 0));
        return ptsB - ptsA;
      });
    } else {
      const sortedByTimeAndPts = [...skaters].sort((a, b) => {
        const ptsA = (parseInt(a.pts) || (parseInt(a.g) || 0) + (parseInt(a.a) || 0));
        const ptsB = (parseInt(b.pts) || (parseInt(b.g) || 0) + (parseInt(b.a) || 0));
        if (ptsB !== ptsA) return ptsB - ptsA;
        return (b.toiSeconds || 0) - (a.toiSeconds || 0);
      });
      chosenSkaters = sortedByTimeAndPts.slice(0, 5);
      scorers.forEach(sc => {
        if (!chosenSkaters.some(cs => cs.name === sc.name)) chosenSkaters.push(sc);
      });
    }

    if (chosenSkaters.length > 0) {
      html += `<div style="margin-top:2px;">⭐ <b>Ключевые полевые игроки:</b></div>`;
      chosenSkaters.forEach(s => {
        const g = parseInt(s.g) || 0;
        const a = parseInt(s.a) || 0;
        const pts = g + a;
        html += `<div style="padding-left:10px;">• #${s.num || '—'} <b>${s.name}</b> — Очки: <b>${pts}</b> (${g}+${a}), +/-: ${s.plusMinus || 0}, ВП: ${s.toi || '—'}</div>`;
      });
    }

    list.innerHTML = html;
    card.style.display = html ? 'flex' : 'none';
  }

  async function saveDayData() {
    if (!activeSelectedDateKey) return;

    const existing = hubDaysData[activeSelectedDateKey] || {};
    const trainTitle = document.getElementById('trainTitle').value.trim();
    const trainTime = document.getElementById('trainTime').value.trim();
    const trainDuration = document.getElementById('trainDuration').value.trim();
    const trainGoals = document.getElementById('trainGoals').value.trim();

    const matchOpponent = document.getElementById('matchOpponent').value.trim();
    const matchScore = document.getElementById('matchScore').value.trim();
    const matchType = document.getElementById('matchType').value;

    const players = [];
    document.querySelectorAll('#playersTableBody tr').forEach(row => {
      const num = row.querySelector('.p-num').value.trim();
      const name = row.querySelector('.p-name').value.trim();
      if (num || name) {
        let rawMhl = null;
        try {
          if (row.dataset.rawMhl) rawMhl = JSON.parse(row.dataset.rawMhl);
        } catch (e) {}

        const g = row.querySelector('.p-g').value;
        const a = row.querySelector('.p-a').value;
        const ptsCalc = (parseInt(g) || 0) + (parseInt(a) || 0);

        players.push({
          num,
          name,
          g,
          a,
          pts: String(ptsCalc),
          plusMinus: row.querySelector('.p-pm').value,
          pim: row.querySelector('.p-pim').value,
          toi: row.dataset.toi || '00:00',
          toiSeconds: parseInt(row.dataset.toiSeconds) || 0,
          isGoalie: row.dataset.isGoalie === '1' || name.includes('(Вр)'),
          rawMhl: rawMhl
        });
      }
    });

    const isTrainingEmpty = !trainTitle && !trainTime && !trainDuration && !trainGoals && !existing.training?.attachedDocxId;
    const isMatchEmpty = !matchOpponent && !matchScore && players.length === 0;

    if (isTrainingEmpty && isMatchEmpty) {
      delete hubDaysData[activeSelectedDateKey];
    } else {
      hubDaysData[activeSelectedDateKey] = {
        training: isTrainingEmpty ? null : {
          title: trainTitle || existing.training?.title || 'Тренировка',
          time: trainTime,
          duration: trainDuration,
          goals: trainGoals,
          attachedDocxId: existing.training?.attachedDocxId || null,
          attachedDocxName: existing.training?.attachedDocxName || null
        },
        match: isMatchEmpty ? null : { opponent: matchOpponent, score: matchScore, type: matchType },
        players: players
      };
    }

    await saveToStorage();
    renderCalendar();
    closeDayModal();
  }

  async function deleteCurrentDayData() {
    if (!confirm('Очистить все данные за этот день?')) return;
    delete hubDaysData[activeSelectedDateKey];
    await saveToStorage();
    renderCalendar();
    closeDayModal();
  }

  function goToCreateWorkout() {
    saveDayData();
    const trainTitle = encodeURIComponent(document.getElementById('trainTitle').value.trim() || 'Тренировка');
    window.location.href = `./tablet.html?date=${activeSelectedDateKey}&title=${trainTitle}&openWorkout=1`;
  }

  function goToFullStatsPage() {
    saveDayData();
    window.location.href = `./stats.html?date=${activeSelectedDateKey}`;
  }

  async function openSelectWorkoutModal() {
    const list = document.getElementById('savedWorkoutsList');
    list.innerHTML = '';
    const workouts = await localforage.getItem('hockey_generated_workouts') || [];

    if (workouts.length === 0) {
      list.innerHTML = '<div style="color:var(--text-muted); padding:10px;">Нет созданных тренировок. Перейдите в Планшет тренера и нажмите «Собрать и скачать DOCX».</div>';
      document.getElementById('selectWorkoutModal').style.display = 'flex';
      return;
    }

    workouts.slice().reverse().forEach(w => {
      const item = document.createElement('div');
      item.className = 'docx-item';
      item.innerHTML = `
        <div>
          <div style="font-weight:700; font-size:13px; color:#fff;">${w.title}</div>
          <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">
            Создано: ${w.createdAt} | Время: ${w.time || '—'} | Длительность: ${w.duration || '—'}
          </div>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-accent" onclick="attachWorkoutToDay('${w.id}')"><i class="ph-bold ph-check"></i> Выбрать</button>
          <button onclick="downloadWorkoutFile('${w.id}')" title="Скачать .docx"><i class="ph-bold ph-download-simple"></i></button>
          <button class="btn-danger" onclick="deleteSavedWorkout('${w.id}')" title="Удалить"><i class="ph ph-trash"></i></button>
        </div>
      `;
      list.appendChild(item);
    });

    document.getElementById('selectWorkoutModal').style.display = 'flex';
  }

  function closeSelectWorkoutModal() {
    document.getElementById('selectWorkoutModal').style.display = 'none';
  }

  async function attachWorkoutToDay(workoutId) {
    const workouts = await localforage.getItem('hockey_generated_workouts') || [];
    const target = workouts.find(w => w.id === workoutId);
    if (!target) return;

    if (!hubDaysData[activeSelectedDateKey]) {
      hubDaysData[activeSelectedDateKey] = {};
    }

    hubDaysData[activeSelectedDateKey].training = {
      title: target.title,
      time: target.time || '',
      duration: target.duration || '',
      goals: target.goals || '',
      attachedDocxId: target.id,
      attachedDocxName: `${target.title}.docx`
    };

    document.getElementById('trainTitle').value = target.title;
    document.getElementById('trainTime').value = target.time || '';
    document.getElementById('trainDuration').value = target.duration || '';
    document.getElementById('attachedDocxStatus').innerHTML = `<span style="color:var(--accent-green);"><i class="ph-bold ph-check"></i> Прикреплен: <b>${target.title}.docx</b></span>`;

    await saveToStorage();
    renderCalendar();
    closeSelectWorkoutModal();
  }

  async function downloadWorkoutFile(workoutId) {
    const workouts = await localforage.getItem('hockey_generated_workouts') || [];
    const target = workouts.find(w => w.id === workoutId);
    if (!target || !target.base64) return;

    const byteCharacters = atob(target.base64);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    saveAs(blob, `${target.title}.docx`);
  }

  async function deleteSavedWorkout(workoutId) {
    if (!confirm('Удалить эту тренировку из библиотеки?')) return;
    let workouts = await localforage.getItem('hockey_generated_workouts') || [];
    workouts = workouts.filter(w => w.id !== workoutId);
    await localforage.setItem('hockey_generated_workouts', workouts);
    openSelectWorkoutModal();
  }

  /* ВСТАВКА И РАСПОЗНАВАНИЕ МХЛ / КХЛ С СОХРАНЕНИЕМ ВСЕХ 26 ПАРАМЕТРОВ */
  function openMhlPasteModal() {
    document.getElementById('mhlRawInput').value = '';
    document.getElementById('mhlPasteModal').style.display = 'flex';
  }

  function closeMhlPasteModal() {
    document.getElementById('mhlPasteModal').style.display = 'none';
  }

  function processMhlPastedText() {
    const rawText = document.getElementById('mhlRawInput').value;
    if (!rawText.trim()) {
      alert('Поле пустое. Вставьте скопированный текст.');
      return;
    }

    const parsedPlayers = [];
    const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);

    let currentRole = 'skater';
    let pendingNum = null;

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

      if (/^вратари/i.test(line)) {
        currentRole = 'goalie';
        continue;
      }
      if (/^(защитники|нападающие)/i.test(line)) {
        currentRole = 'skater';
        continue;
      }

      if (/^(игрок|глоссарий|%\s*об|%\s*вбр)/i.test(line)) continue;
      if (/^[ишпво\+\/\-\s%]+$/i.test(line)) continue;

      if (/^\d{1,2}$/.test(line)) {
        pendingNum = line;
        continue;
      }

      const nameMatch = line.match(/^([А-ЯЁ][а-яё\-]+(?:\s+[А-ЯЁ][а-яё\-]+|\s+[А-ЯЁ]\.|\s+М\.)*(?:\s*\([КАA-ZА-Я]\))*)/);
      if (nameMatch) {
        const playerName = nameMatch[1].trim();
        const playerNum = pendingNum || '';
        pendingNum = null;

        const rest = line.substring(nameMatch[0].length).trim();

        if (currentRole === 'goalie') {
          let a = '0', pim = '0';
          const tokens = rest.split(/[\t\s]+/).filter(Boolean);

          if (tokens.length >= 8) {
            a = tokens[9] || '0';
            pim = tokens[11] || '0';
          } else {
            const timeMatch = rest.match(/(\d+):(\d+)/);
            if (timeMatch) {
              const beforeTime = rest.substring(0, timeMatch.index);
              const digitsEnd = beforeTime.slice(-3);
              pim = digitsEnd.slice(-1) || '0';
            }
          }

          let toi = '00:00';
          const timeMatch = rest.match(/(\d+:\d+)/);
          if (timeMatch) toi = timeMatch[1];
          const tParts = toi.split(':').map(Number);
          const toiSec = (tParts[0] || 0) * 60 + (tParts[1] || 0);

          parsedPlayers.push({
            num: playerNum,
            name: `${playerName} (Вр)`,
            g: '0',
            a: isNaN(parseInt(a)) ? '0' : a,
            pts: isNaN(parseInt(a)) ? '0' : a,
            plusMinus: '0',
            pim: isNaN(parseInt(pim)) ? '0' : pim,
            toi: toi,
            toiSeconds: toiSec,
            isGoalie: true,
            rawMhl: tokens
          });
        } else {
          let g = '0', a = '0', plusMinus = '0', pim = '0';
          const pmMatch = rest.match(/([+-]\d+)/);
          if (pmMatch) plusMinus = pmMatch[1];

          const tokens = rest.split(/[\t\s]+/).filter(Boolean);
          if (tokens.length >= 7) {
            g = tokens[1] || '0';
            a = tokens[2] || '0';
            pim = tokens[7] || '0';
          } else {
            const digits = rest.match(/^(\d)(\d)(\d)(\d)/);
            if (digits) {
              g = digits[2];
              a = digits[3];
            }
            if (pmMatch) {
              const afterPm = rest.substring(pmMatch.index + pmMatch[0].length);
              const pimDigits = afterPm.match(/^\d{2}(\d+)/);
              if (pimDigits) pim = pimDigits[1].charAt(0);
            }
          }

          let toi = '00:00';
          const timeMatch = rest.match(/(\d+:\d+)/);
          if (timeMatch) toi = timeMatch[1];
          const tParts = toi.split(':').map(Number);
          const toiSec = (tParts[0] || 0) * 60 + (tParts[1] || 0);
          const ptsCalc = (parseInt(g) || 0) + (parseInt(a) || 0);

          parsedPlayers.push({
            num: playerNum,
            name: playerName,
            g: isNaN(parseInt(g)) ? '0' : g,
            a: isNaN(parseInt(a)) ? '0' : a,
            pts: String(ptsCalc),
            plusMinus: plusMinus,
            pim: isNaN(parseInt(pim)) ? '0' : pim,
            toi: toi,
            toiSeconds: toiSec,
            isGoalie: false,
            rawMhl: tokens
          });
        }
      }
    }

    if (parsedPlayers.length === 0) {
      alert('Не удалось распознать строки. Проверьте скопированный текст.');
      return;
    }

    renderPlayersTable(parsedPlayers);
    renderDayHighlights(parsedPlayers);
    closeMhlPasteModal();
    alert(`Успешно распознано игроков: ${parsedPlayers.length}`);
  }

  function exportHubData() {
    const blob = new Blob([JSON.stringify(hubDaysData, null, 2)], { type: 'application/json' });
    saveAs(blob, `hockey_hub_backup_${new Date().toISOString().slice(0,10)}.json`);
  }

  function importHubData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        hubDaysData = { ...hubDaysData, ...imported };
        await saveToStorage();
        renderCalendar();
        alert('База хаба успешно импортирована!');
      } catch (err) {
        alert('Ошибка при импорте файла: ' + err.message);
      }
    };
    reader.readAsText(file);
  }
</script>
