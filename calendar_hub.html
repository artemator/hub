<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Календарь-Хаб | Хоккейный центр тренера</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- localforage для надежного хранения без лимита 5 МБ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

  <style>
    :root {
      --bg-dark: #0b1120;
      --panel-bg: #151f32;
      --card-bg: #1e293b;
      --border-color: #2b3952;
      --accent-blue: #38bdf8;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ВЕРХНЯЯ ПАНЕЛЬ */
    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--border-color);
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 20;
    }

    .brand-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover { background: #334155; }
    button.btn-accent { background: #0284c7; border-color: var(--accent-blue); }
    button.btn-accent:hover { background: #0369a1; }
    button.btn-success { background: #15803d; border-color: #4ade80; }
    button.btn-danger { background: #991b1b; border-color: #ef4444; }

    /* ГЛАВНОЕ ПОЛОТНО КАЛЕНДАРЯ-ХАБА */
    .calendar-hub-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px 16px;
      overflow: hidden;
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
    }

    .calendar-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .month-selector {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .month-selector h2 {
      font-size: 1.25rem;
      font-weight: 700;
      min-width: 180px;
      text-align: center;
      text-transform: capitalize;
    }

    .legend-indicators {
      display: flex;
      gap: 14px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.dot-match { background: var(--accent-amber); }
    .dot.dot-training { background: var(--accent-green); }

    /* СЕТКА КАЛЕНДАРЯ */
    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .cal-days-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
      padding-top: 8px;
    }

    .day-cell {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .day-cell:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .day-cell.empty-pad {
      opacity: 0.25;
      cursor: default;
      pointer-events: none;
    }
    .day-cell.is-today {
      border-color: var(--accent-blue);
      background: #162642;
    }

    .day-number-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-num {
      font-size: 13px;
      font-weight: 700;
    }
    .day-cell.is-today .day-num {
      color: var(--accent-blue);
    }

    .day-badges-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 4px;
      overflow: hidden;
    }

    .event-badge {
      font-size: 9.5px;
      font-weight: 600;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .badge-match {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }
    .badge-training {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }

    /* МОДАЛЬНОЕ ОКНО ДНЯ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 12px;
    }

    .modal-card-day {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 820px;
      max-width: 96vw;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 16px 50px rgba(0,0,0,0.85);
    }

    .modal-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111a2c;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tabs-nav {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .tab-btn {
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #0284c7;
      border-color: var(--accent-blue);
      color: #fff;
      font-weight: 600;
    }

    .tab-content { display: none; flex-direction: column; gap: 14px; }
    .tab-content.active { display: flex; }

    .form-grid-3 {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-blue); }

    /* ТАБЛИЦА СТАТИСТИКИ ИГРОКОВ */
    .stats-table-wrapper {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow-x: auto;
      max-height: 240px;
    }
    table.stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      text-align: center;
    }
    table.stats-table th {
      background: #1e293b;
      padding: 7px;
      color: var(--text-muted);
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    table.stats-table td {
      padding: 4px 6px;
      border-bottom: 1px solid var(--border-color);
    }
    table.stats-table input {
      background: #111b2b;
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
      padding: 3px 5px;
      font-size: 11px;
      text-align: center;
      width: 100%;
    }

    .modal-footer {
      padding: 10px 18px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111a2c;
    }

    @media (max-width: 768px) {
      .form-grid-3 { grid-template-columns: 1fr; }
      .legend-indicators { display: none; }
      .cal-days-grid { gap: 3px; }
      .day-cell { padding: 4px; }
      .event-badge span { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="brand-title">
    <i class="ph-bold ph-calendar-check" style="font-size: 22px;"></i>
    <span>Центр управления тренера (Hub)</span>
  </div>
  <div class="header-controls">
    <button class="btn-accent" onclick="launchTacticsBoard()" title="Открыть хоккейный планшет PRO">
      <i class="ph-bold ph-hockey-puck"></i> Планшет PRO
    </button>
    <button onclick="exportHubData()" title="Скачать базу в JSON"><i class="ph-bold ph-download-simple"></i> Резерв</button>
    <input type="file" id="importHubInput" accept=".json" style="display:none;" onchange="importHubData(event)">
    <button onclick="document.getElementById('importHubInput').click()" title="Загрузить JSON"><i class="ph-bold ph-upload-simple"></i> Импорт</button>
  </div>
</header>

<main class="calendar-hub-container">
  <div class="calendar-toolbar">
    <div class="month-selector">
      <button onclick="changeMonth(-1)"><i class="ph-bold ph-caret-left"></i></button>
      <h2 id="calendarMonthTitle">Сентябрь 2026</h2>
      <button onclick="changeMonth(1)"><i class="ph-bold ph-caret-right"></i></button>
      <button onclick="goToToday()" style="font-size:11px;">Сегодня</button>
    </div>

    <div class="legend-indicators">
      <div class="legend-item"><span class="dot dot-match"></span> Матч / Статистика</div>
      <div class="legend-item"><span class="dot dot-training"></span> Ледовая тренировка</div>
    </div>
  </div>

  <div class="cal-weekdays">
    <span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span>
  </div>

  <div class="cal-days-grid" id="calendarDaysGrid"></div>
</main>

<!-- МОДАЛЬНОЕ ОКНО ДНЯ (ХАБ: ТРЕНИРОВКА / МАТЧ) -->
<div class="modal-overlay" id="dayHubModal" onclick="if(event.target===this) closeDayModal()">
  <div class="modal-card-day">
    <div class="modal-header">
      <div style="display:flex; align-items:center; gap:8px;">
        <i class="ph-bold ph-calendar" style="color:var(--accent-blue); font-size:18px;"></i>
        <h3 id="modalDayTitle" style="font-size: 15px;">27 Сентября 2026</h3>
      </div>
      <button onclick="closeDayModal()" style="padding:4px 8px;"><i class="ph ph-x"></i></button>
    </div>

    <div class="modal-body">
      <div class="tabs-nav">
        <button class="tab-btn active" id="tabBtnTraining" onclick="switchDayTab('training')">
          <i class="ph-bold ph-clipboard-text"></i> Тренировка
        </button>
        <button class="tab-btn" id="tabBtnMatch" onclick="switchDayTab('match')">
          <i class="ph-bold ph-trophy"></i> Матч и статистика
        </button>
      </div>

      <!-- ВКЛАДКА 1: ТРЕНИРОВКА -->
      <div class="tab-content active" id="tabContentTraining">
        <div class="form-grid-3">
          <div class="form-group">
            <label>Тема занятия</label>
            <input type="text" id="trainTitle" placeholder="Выходы из зоны, большинство 5х4...">
          </div>
          <div class="form-group">
            <label>Время</label>
            <input type="text" id="trainTime" placeholder="08:45 – 10:15">
          </div>
          <div class="form-group">
            <label>Длительность</label>
            <input type="text" id="trainDuration" placeholder="90 минут">
          </div>
        </div>

        <div class="form-group">
          <label>Ключевые цели и акценты занятия</label>
          <textarea id="trainGoals" rows="2" placeholder="Быстрый пас под дальнюю синюю линию, активный форчекинг..."></textarea>
        </div>

        <div style="background:#0c1322; border:1px solid var(--border-color); border-radius:8px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-size:12px; font-weight:700; color:var(--accent-blue);">Собрать схемы на тактическом планшете PRO</div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">Запустит холст с разметкой льда, калькой и экспортом в Word DOCX.</div>
          </div>
          <button class="btn-success" onclick="openTacticsBoardForDay()">
            <i class="ph-bold ph-arrow-square-out"></i> В планшет PRO
          </button>
        </div>
      </div>

      <!-- ВКЛАДКА 2: МАТЧ И СТАТИСТИКА ИГРОКОВ -->
      <div class="tab-content" id="tabContentMatch">
        <div class="form-grid-3">
          <div class="form-group">
            <label>Соперник</label>
            <input type="text" id="matchOpponent" placeholder="ХК СКА-Стрельна">
          </div>
          <div class="form-group">
            <label>Итоговый счёт (Мы : Они)</label>
            <input type="text" id="matchScore" placeholder="4 : 2">
          </div>
          <div class="form-group">
            <label>Статус игры</label>
            <select id="matchType">
              <option value="official">Официальный матч</option>
              <option value="friendly">Товарищеская игра</option>
              <option value="tournament">Турнир</option>
            </select>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label style="font-size:11px; font-weight:700; color:var(--text-muted);">СТАТИСТИКА СОСТАВА И ИГРОКОВ</label>
          <button onclick="addPlayerRow()" style="padding:3px 8px; font-size:11px;"><i class="ph-bold ph-plus"></i> + Игрок</button>
        </div>

        <div class="stats-table-wrapper">
          <table class="stats-table" id="playersTable">
            <thead>
              <tr>
                <th style="width: 60px;">№</th>
                <th style="text-align:left; padding-left:10px;">Фамилия Имя</th>
                <th style="width: 60px;">Г (Гол)</th>
                <th style="width: 60px;">П (Пас)</th>
                <th style="width: 60px;">+/-</th>
                <th style="width: 60px;">Штр (мин)</th>
                <th style="width: 40px;"></th>
              </tr>
            </thead>
            <tbody id="playersTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-danger" onclick="deleteCurrentDayData()"><i class="ph ph-trash"></i> Очистить этот день</button>
      <div style="display:flex; gap:8px;">
        <button onclick="closeDayModal()">Закрыть</button>
        <button class="btn-accent" onclick="saveDayData()"><i class="ph-bold ph-floppy-disk"></i> Сохранить данные</button>
      </div>
    </div>
  </div>
</div>

<script>
  localforage.config({
    name: 'HockeyCoachHub',
    storeName: 'coach_hub_calendar'
  });

  let currentYear = 2026;
  let currentMonth = 8; // Сентябрь (0-индексированный)
  let activeSelectedDateKey = null; // YYYY-MM-DD

  // База дней: { "2026-09-27": { training: {...}, match: {...}, players: [...] } }
  let hubDaysData = {};

  const monthNames = [
    "Январь", "Февраль", "Март", "Апрель", "Май", "Июнь",
    "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"
  ];

  window.addEventListener('DOMContentLoaded', async () => {
    const loaded = await localforage.getItem('hockey_hub_days');
    if (loaded) hubDaysData = loaded;

    // Демо-данные, если база пустая
    if (Object.keys(hubDaysData).length === 0) {
      hubDaysData["2026-09-27"] = {
        training: {
          title: "Лед: Выходы из зоны и раскат",
          time: "08:45 – 10:15",
          duration: "90 мин",
          goals: "Отработка 1-го паса под давлением защитников"
        },
        match: {
          opponent: "ХК Динамо",
          score: "5 : 3",
          type: "official"
        },
        players: [
          { num: "97", name: "Иванов А.", g: "2", a: "1", plusMinus: "+3", pim: "0" },
          { num: "11", name: "Петров С.", g: "1", a: "2", plusMinus: "+2", pim: "2" },
          { num: "8", name: "Смирнов М.", g: "0", a: "1", plusMinus: "+1", pim: "4" }
        ]
      };
      await saveToStorage();
    }

    renderCalendar();
  });

  async function saveToStorage() {
    await localforage.setItem('hockey_hub_days', hubDaysData);
  }

  function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth < 0) {
      currentMonth = 11;
      currentYear--;
    } else if (currentMonth > 11) {
      currentMonth = 0;
      currentYear++;
    }
    renderCalendar();
  }

  function goToToday() {
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth();
    renderCalendar();
  }

  function renderCalendar() {
    document.getElementById('calendarMonthTitle').textContent = `${monthNames[currentMonth]} ${currentYear}`;
    const grid = document.getElementById('calendarDaysGrid');
    grid.innerHTML = '';

    const firstDayIndex = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7; // Понедельник = 0
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    // Предыдущий месяц (отступы)
    for (let i = 0; i < firstDayIndex; i++) {
      const pad = document.createElement('div');
      pad.className = 'day-cell empty-pad';
      grid.appendChild(pad);
    }

    const todayStr = new Date().toISOString().slice(0, 10);

    for (let d = 1; d <= daysInMonth; d++) {
      const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      if (dateKey === todayStr) cell.classList.add('is-today');

      const data = hubDaysData[dateKey];

      let badgesHtml = '';
      if (data) {
        if (data.training && data.training.title) {
          badgesHtml += `<div class="event-badge badge-training" title="Тренировка: ${data.training.title}"><i class="ph-bold ph-clipboard"></i> <span>${data.training.title}</span></div>`;
        }
        if (data.match && data.match.opponent) {
          const scoreStr = data.match.score ? ` (${data.match.score})` : '';
          badgesHtml += `<div class="event-badge badge-match" title="Матч: против ${data.match.opponent}"><i class="ph-bold ph-trophy"></i> <span>${data.match.opponent}${scoreStr}</span></div>`;
        }
      }

      cell.innerHTML = `
        <div class="day-number-row">
          <span class="day-num">${d}</span>
        </div>
        <div class="day-badges-col">${badgesHtml}</div>
      `;

      cell.onclick = () => openDayModal(dateKey);
      grid.appendChild(cell);
    }
  }

  /* ЛОГИКА ДНЯ */
  function openDayModal(dateKey) {
    activeSelectedDateKey = dateKey;
    const parts = dateKey.split('-');
    document.getElementById('modalDayTitle').textContent = `${parseInt(parts[2])} ${monthNames[parseInt(parts[1]) - 1]} ${parts[0]}`;

    const data = hubDaysData[dateKey] || {};

    // Заполнение вкладки тренировки
    document.getElementById('trainTitle').value = data.training?.title || '';
    document.getElementById('trainTime').value = data.training?.time || '';
    document.getElementById('trainDuration').value = data.training?.duration || '';
    document.getElementById('trainGoals').value = data.training?.goals || '';

    // Заполнение вкладки матча
    document.getElementById('matchOpponent').value = data.match?.opponent || '';
    document.getElementById('matchScore').value = data.match?.score || '';
    document.getElementById('matchType').value = data.match?.type || 'official';

    // Таблица состава
    renderPlayersTable(data.players || []);

    switchDayTab('training');
    document.getElementById('dayHubModal').style.display = 'flex';
  }

  function closeDayModal() {
    document.getElementById('dayHubModal').style.display = 'none';
  }

  function switchDayTab(tab) {
    document.getElementById('tabBtnTraining').classList.toggle('active', tab === 'training');
    document.getElementById('tabBtnMatch').classList.toggle('active', tab === 'match');
    document.getElementById('tabContentTraining').classList.toggle('active', tab === 'training');
    document.getElementById('tabContentMatch').classList.toggle('active', tab === 'match');
  }

  function renderPlayersTable(players) {
    const tbody = document.getElementById('playersTableBody');
    tbody.innerHTML = '';
    if (players.length === 0) {
      addPlayerRow();
      return;
    }
    players.forEach(p => addPlayerRow(p));
  }

  function addPlayerRow(player = { num: '', name: '', g: '0', a: '0', plusMinus: '0', pim: '0' }) {
    const tbody = document.getElementById('playersTableBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" class="p-num" value="${player.num}" placeholder="№"></td>
      <td style="text-align:left;"><input type="text" class="p-name" value="${player.name}" placeholder="Фамилия Имя" style="text-align:left;"></td>
      <td><input type="number" class="p-g" value="${player.g}"></td>
      <td><input type="number" class="p-a" value="${player.a}"></td>
      <td><input type="text" class="p-pm" value="${player.plusMinus}"></td>
      <td><input type="number" class="p-pim" value="${player.pim}"></td>
      <td><button onclick="this.closest('tr').remove()" style="padding:2px 5px; color:#ef4444;"><i class="ph ph-trash"></i></button></td>
    `;
    tbody.appendChild(tr);
  }

  async function saveDayData() {
    if (!activeSelectedDateKey) return;

    const trainTitle = document.getElementById('trainTitle').value.trim();
    const trainTime = document.getElementById('trainTime').value.trim();
    const trainDuration = document.getElementById('trainDuration').value.trim();
    const trainGoals = document.getElementById('trainGoals').value.trim();

    const matchOpponent = document.getElementById('matchOpponent').value.trim();
    const matchScore = document.getElementById('matchScore').value.trim();
    const matchType = document.getElementById('matchType').value;

    const players = [];
    document.querySelectorAll('#playersTableBody tr').forEach(row => {
      const num = row.querySelector('.p-num').value.trim();
      const name = row.querySelector('.p-name').value.trim();
      if (num || name) {
        players.push({
          num,
          name,
          g: row.querySelector('.p-g').value,
          a: row.querySelector('.p-a').value,
          plusMinus: row.querySelector('.p-pm').value,
          pim: row.querySelector('.p-pim').value
        });
      }
    });

    const isTrainingEmpty = !trainTitle && !trainTime && !trainDuration && !trainGoals;
    const isMatchEmpty = !matchOpponent && !matchScore && players.length === 0;

    if (isTrainingEmpty && isMatchEmpty) {
      delete hubDaysData[activeSelectedDateKey];
    } else {
      hubDaysData[activeSelectedDateKey] = {
        training: isTrainingEmpty ? null : { title: trainTitle, time: trainTime, duration: trainDuration, goals: trainGoals },
        match: isMatchEmpty ? null : { opponent: matchOpponent, score: matchScore, type: matchType },
        players: players
      };
    }

    await saveToStorage();
    renderCalendar();
    closeDayModal();
  }

  async function deleteCurrentDayData() {
    if (!confirm('Очистить все данные за этот день?')) return;
    delete hubDaysData[activeSelectedDateKey];
    await saveToStorage();
    renderCalendar();
    closeDayModal();
  }

  /* ПЕРЕХОД В ТАКТИЧЕСКИЙ ПЛАНШЕТ PRO */
  function openTacticsBoardForDay() {
    // Сохраняем перед переходом
    saveDayData();
    // Передаем дату и тему в параметры ссылки планшета
    const title = encodeURIComponent(document.getElementById('trainTitle').value.trim() || 'Тренировка');
    window.location.href = `./index.html?date=${activeSelectedDateKey}&title=${title}`;
  }

  function launchTacticsBoard() {
    window.location.href = './index.html';
  }

  /* РЕЗЕРВНОЕ КОПИРОВАНИЕ ХАБА */
  function exportHubData() {
    const blob = new Blob([JSON.stringify(hubDaysData, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `hockey_hub_backup_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function importHubData(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const imported = JSON.parse(ev.target.result);
        hubDaysData = { ...hubDaysData, ...imported };
        await saveToStorage();
        renderCalendar();
        alert('База хаба успешно импортирована!');
      } catch (err) {
        alert('Ошибка при импорте файла: ' + err.message);
      }
    };
    reader.readAsText(file);
  }
</script>
</body>
